name: Collect historical stock data
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/collect-stock-data.yml"
      - "tools/collect_historical_market_data.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "stock-data-collection"
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect candidate data
        run: python tools/collect_historical_market_data.py data/stock-candidates
      - name: Show audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/stock-candidates/source_audit_report.json").read_text(encoding="utf-8"))
          print(json.dumps(report["totals"], ensure_ascii=False, indent=2))
          for ticker, row in report["results"].items():
              print(f'{ticker}: fetch={row["fetch_status"]}; base={row["base_price_status"]}; missing={row["missing_count"]}/25; error={row["fetch_error"]}')
          PY
      - name: Commit candidate data and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-candidates/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Collect candidate historical stock data with audit report"
            git push
          fi
