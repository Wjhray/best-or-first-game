t:"";position:absolute;inset:25%;border:1px dashed #a47c4438;border-radius:50%}.needle{position:absolute;left:50%;top:8%;height:43%;width:2px;background:linear-gradient(var(--gold),transparent);transform-origin:50% 100%;z-index:2}.hub{position:absolute;inset:38%;display:grid;place-items:center;border:1px solid #87612f;border-radius:50%;background:#251a2d;color:var(--gold);font-size:26px;z-index:3}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metric{background:#201824;border:1px solid #403447;border-radius:11px;padding:10px 5px;text-align:center}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;font-size:16px;margin-top:4px}.turn{padding:11px;border-radius:12px;margin-bottom:10px;font-weight:850}.turn.red{background:#351923;border:1px solid #783342;color:#ff9ca7}.turn.blue{background:#192c42;border:1px solid #2d5f91;color:#91c8ff}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fire,.pass{border-radius:13px;min-height:60px;font-weight:900}.fire{background:linear-gradient(145deg,#f5d991,#c88d35);color:#261807;border:0}.pass{background:#292131;color:#f8f2e8;border:1px solid #514156}.actiongrid small{display:block;font-size:10px;font-weight:600;margin-top:4px}.log{display:grid;gap:7px}.logline{font-size:11px;line-height:1.55;color:#d0c4d5;border-bottom:1px solid #352b3b;padding:0 0 7px}.modalback{position:fixed;inset:0;background:#050308d9;display:grid;place-items:center;padding:20px;z-index:10}.modalback.hide{display:none}.modal{max-width:400px;width:100%;background:#1c1724;border:1px solid #695338;border-radius:18px;padding:20px}.modal h2{margin:0 0 9px;font-size:20px}.modal p{font-size:13px;line-height:1.7;color:#d0c5d5}.footer{text-align:center;color:#766b7f;font-size:9px;letter-spacing:1px;padding:12px 0 0}
</style></head><body><main class="app"><header class="head"><div class="mark">✦</div><div><h1>24發俄羅斯輪盤</h1><div class="sub">V10 手機單機版 · 以 V9 規則為基準</div></div><button class="reset" id="reset" aria-label="重新開始">↻</button></header><div class="strip">● 單機雙人　·　不需帳號　·　首次載入後可離線</div><div id="screen"></div><div class="footer">LOCAL DUEL SYSTEM · V10.0.0</div></main><div class="modalback hide" id="modalback"><section class="modal"><h2 id="mtitle"></h2><p id="mbody"></p><div class="actions" id="mactions"></div></section></div><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)},screen=$('screen'),modal=$('modalback'),phase='setup',loader='red',draft={red:null,blue:null},selected=[],attempt=1,game=null,logs=[],fees=[1,2,4,8,16],names={red:'紅方',blue:'藍方'};function other(t){return t==='red'?'blue':'red'}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function modalShow(title,body,actions){$('mtitle').textContent=title;$('mbody').textContent=body;$('mactions').innerHTML=actions.map(function(a){return '<button class="'+a.kind+'" data-modal="'+a.id+'">'+a.label+'</button>'}).join('');modal.classList.remove('hide')}function modalClose(){modal.classList.add('hide')}function addlog(s){logs.unshift(s);logs=logs.slice(0,8)}function setup(){phase='setup';game=null;draft={red:null,blue:null};selected=[];loader='red';attempt=1;logs=[];render()}function begin(){phase='load';loader='red';selected=[];draft={red:null,blue:null};attempt=1;render()}function loading(){var slots='';for(var i=0;i<24;i++)slots+='<button class="slot '+(selected.indexOf(i)>=0?'sel':'')+'" data-slot="'+i+'">'+(i+1)+'</button>';return '<section class="panel"><div class="kicker">SECRET LOADING · '+(attempt===1?'FIRST ATTEMPT':'RELOAD ATTEMPT '+attempt)+'</div><h2>'+names[loader]+'秘密裝填</h2><p class="muted">請由'+names[loader]+'選擇 24 格中的 3 個不同位置。完成後交給另一方；對戰畫面不會顯示格位編號。</p><div class="slotgrid">'+slots+'</div><div class="summary"><span>已選擇</span><b>'+selected.length+' / 3</b></div><div class="actions"><button class="secondary" data-action="clear">清除重選</button><button class="primary" data-action="confirm-load" '+(selected.length!==3?'disabled':'')+'>確認秘密裝填</button></div></section><section class="panel"><div class="kicker">RULES</div><div class="muted">紅藍各裝填 3 發。若雙方任一位置重疊，雙方全部 6 個選位都會清除並重新裝填。請勿讓對手看到你選的位置。</div></section>'}function handoff(){return '<section class="panel handoff"><div class="emblem">⇄</div><div class="kicker">PRIVATE HANDOFF</div><h2>請交接手機</h2><p class="muted">紅方已完成秘密裝填。請把手機交給藍方，確認對手看不到上一階段，再繼續選位。</p><div class="actions"><button class="secondary" data-action="cancel">取消本局</button><button class="primary" data-action="handoff">交給藍方　→</button></div></section>'}function wheel(){return '<div class="wheelbox"><div class="wheel"><div class="needle" style="transform:translateX(-50%) rotate('+(game.slot*15)+'deg)"></div><div class="hub">✦</div></div></div>'}function battle(){var remain=game.bullets.filter(function(b){return !b.used}).length,logsHtml=logs.map(function(x){return '<div class="logline">'+esc(x)+'</div>'}).join('');return '<div class="stats"><div class="stat"><small>紅方籌碼</small><b>'+game.chips.red+'</b></div><div class="stat"><small>藍方籌碼</small><b>'+game.chips.blue+'</b></div></div><section class="panel"><div class="kicker">PHYSICS LOCKED</div><h2>中央輪盤</h2><p class="muted">開局重心模擬已完成並鎖定。每次實際開火推進一格；對戰畫面不顯示格位編號。</p>'+wheel()+'<div class="metrics"><div class="metric"><small>剩餘子彈</small><b>'+remain+' / 6</b></div><div class="metric"><small>已開火</small><b>'+game.shots+' / 24</b></div><div class="metric"><small>連續 PASS</small><b>'+game.streak+' / 5</b></div></div></section><section class="panel"><div class="turn '+game.turn+'">● 現在輪到'+names[game.turn]+'</div>'+(game.notice?'<div class="notice">'+esc(game.notice)+'</div>':'')+'<p class="muted">一般開火若中槍，開火方支付 50 籌碼給對方。開火前會再次確認。</p><div class="actiongrid"><button class="fire" data-action="fire">✦ 開火<small>確認後執行一次</small></button><button class="pass" data-action="pass">↷ PASS<small>本次費用 '+fees[Math.min(game.streak,4)]+' 枚</small></button></div></section><section class="panel"><div class="kicker">EVENT LOG</div><h2>最近紀錄</h2><div class="log">'+(logsHtml||'<div class="muted">尚無紀錄</div>')+'</div></section><button class="secondary" data-action="rules">查看規則</button>'}function final(){var winner=game.chips.red===game.chips.blue?'平手':game.chips.red>game.chips.blue?'紅方獲勝':'藍方獲勝';return '<section class="panel hero"><div class="emblem">🏆</div><div class="kicker">MATCH COMPLETE</div><h2>'+winner+'</h2><p class="muted">本局已開火 '+game.shots+' 次，剩餘子彈 '+game.bullets.filter(function(b){return !b.used}).length+' 發。以最終籌碼決定勝負。</p><div class="teams"><div class="team red"><strong><span class="orb"></span>紅方</strong><small>最終籌碼 '+game.chips.red+'</small></div><div class="team blue"><strong><span class="orb"></span>藍方</strong><small>最終籌碼 '+game.chips.blue+'</small></div></div></section><section class="panel"><h2>本局紀錄</h2><div class="log">'+logs.map(function(x){return '<div class="logline">'+esc(x)+'</div>'}).join('')+'</div></section><button class="primary" data-action="again">再玩一局 ↻</button>'}function render(){if(phase==='setup')screen.innerHTML='<section class="panel hero"><div class="emblem">✦</div><div class="kicker">DUEL · SIX ROUNDS OF FATE</div><h2>24 格，六發命運</h2><p class="muted">兩名玩家使用同一支手機。秘密裝填、重心物理模擬、籌碼博弈，每次開火都可能改變結局。</p><div class="teams"><div class="team red"><strong><span class="orb"></span>紅方</strong><small>150 籌碼 · 秘密裝填 3 發</small></div><div class="team blue"><strong><span class="orb"></span>藍方</strong><small>150 籌碼 · 秘密裝填 3 發</small></div></div><div style="height:15px"></div><button class="primary" data-action="start">開始新對局</button></section><section class="panel"><div class="kicker">QUICK RULES</div><div class="muted">① 雙方各秘密選 3 格，重疊則全部重選。② 裝填成功後只模擬一次重心物理結果。③ 一般中槍支付 50 籌碼。④ PASS 費用依序 1、2、4、8、16；第五次由系統代打且不造成中槍。⑤ 六發子彈耗盡或完成第 24 次開火時結束。</div></section>';else if(phase==='load')screen.innerHTML=loading();else if(phase==='handoff')screen.innerHTML=handoff();else if(phase==='battle')screen.innerHTML=battle();else screen.innerHTML=final()}function simulate(slots){var x=0,y=0;for(var i=0;i<slots.length;i++){var a=-Math.PI/2+slots[i]*Math.PI/12;x+=Math.cos(a);y+=Math.sin(a)}var mag=Math.hypot(x,y);if(mag<1e-9)return 0;var target=Math.PI/2-Math.atan2(y,x),angle=0,vel=0,dt=.004,inertia=.43,gravity=.085*mag/6;for(var j=0;j<6000;j++){vel+=Math.sin(target-angle)*gravity/inertia*dt;vel*=.48;angle+=vel*dt}return Math.round((((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI))/(Math.PI/12))%24}function finishIfNeeded(){if(game.bullets.every(function(b){return b.used})||game.shots>=24){phase='final';addlog('對局結束，以最終籌碼結算。')}}function fire(system){if(!game||phase!=='battle')return;var at=game.slot,bullet=game.bullets.find(function(b){return !b.used&&b.slot===at}),shooter=game.turn;game.shots++;if(bullet){bullet.used=true;if(!system){game.chips[shooter]-=50;game.chips[other(shooter)]+=50;game.notice=names[shooter]+'中槍，支付 50 籌碼給'+names[other(shooter)]+'。'}else game.notice='系統代打消耗了當前位置的子彈；此特殊情況不造成中槍、不扣 50、不轉帳。'}else game.notice=system?'系統代打：空槍。':'空槍，沒有籌碼轉移。';addlog(system?'第五次 PASS 系統代打：'+(bullet?'消耗子彈':'空槍')+'。':names[shooter]+'開火：'+(bullet?'中槍，轉付 50':'空槍')+'。');game.slot=(game.slot+1)%24;game.turn=other(shooter);game.streak=0;finishIfNeeded();render()}function pass(){var fee=fees[Math.min(game.streak,4)],p=game.turn;if(game.chips[p]<fee){modalShow('籌碼不足','目前無法支付 '+fee+' 枚 PASS 費用。請改為開火。',[{label:'返回',kind:'primary',id:'close'}]);return}game.chips[p]-=fee;game.streak++;if(game.streak===5){game.notice='第五次 PASS：累計費用 31 枚，系統代打且不造成中槍。';fire(true);return}game.notice=names[p]+'支付 PASS 費用 '+fee+' 枚。輪盤與開火回合不推進。';addlog(names[p]+'支付 PASS '+fee+' 枚（連續第 '+game.streak+' 次）。');game.turn=other(p);render()}function confirmLoad(){if(selected.length!==3)return;draft[loader]=selected.slice();selected=[];if(loader==='red'){phase='handoff';render();return}var red=draft.red,blue=draft.blue;if(red.some(function(s){return blue.includes(s)})){draft={red:null,blue:null};loader='red';attempt++;phase='load';modalShow('偵測到重複裝填','紅藍雙方全部六個選位已清除。請從紅方重新秘密裝填；不會揭露重複位置。',[{label:'重新裝填',kind:'primary',id:'close'}]);render();return}var slots=red.concat(blue);game={chips:{red:150,blue:150},bullets:slots.map(function(slot){return {slot:slot,used:false}}),slot:simulate(slots),turn:'red',shots:0,streak:0,notice:'裝填成功。重心物理模擬已鎖定。'};logs=[];addlog('裝填成功：六發子彈的重心物理模擬已鎖定。');phase='battle';render()}screen.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.slot!==undefined){var n=+b.dataset.slot;if(selected.indexOf(n)>=0)selected=selected.filter(function(x){return x!==n});else if(selected.length<3)selected.push(n);selected.sort(function(a,b){return a-b});render();return}switch(b.dataset.action){case'start':begin();break;case'clear':selected=[];render();break;case'confirm-load':confirmLoad();break;case'handoff':loader='blue';phase='load';selected=[];render();break;case'cancel':modalShow('取消本局？','目前所有秘密選位與進度都會清除。',[{label:'繼續裝填',kind:'secondary',id:'close'},{label:'確認取消',kind:'danger',id:'reset'}]);break;case'fire':modalShow('確認'+names[game.turn]+'開火？','此動作只會執行一次。若當前位置有子彈，開火方中槍並支付 50 枚給對方；空槍不付款。',[{label:'返回',kind:'secondary',id:'close'},{label:'確認開火',kind:'primary',id:'fire'}]);break;case'pass':modalShow(game.streak===4?'確認第五次 PASS':'確認 PASS · '+fees[game.streak]+' 枚',game.streak===4?'前四次 1+2+4+8 已支付且不退還；本次只再扣 16，總費用 31。系統將代打一發，消耗可能存在的子彈，但不造成中槍、不扣 50、不轉帳。':'支付 '+fees[game.streak]+' 枚。本次不推進輪盤或回合；正常開火中斷時已付費用不退還。',[{label:'返回',kind:'secondary',id:'close'},{label:'確認 PASS',kind:'primary',id:'pass'}]);break;case'rules':modalShow('遊戲規則與版本紀錄','V10.0.0 手機單機原型，依 V9 規則重建。紅藍各 150 籌碼、各秘密選 3 格；重疊則雙方全部重選。成功裝填後，以六發子彈的重心向量執行一次確定性重力／慣性／阻尼模擬。一般中槍支付 50。PASS 連續費用 1／2／4／8／16；第五次累計沒收 31，系統代打但不造成中槍、不扣 50、不轉帳。六發子彈耗盡或完成第 24 次開火結束。遊戲不儲存個人資料；重新整理會重置當局。',[{label:'返回遊戲',kind:'primary',id:'close'}]);break;case'again':begin();break}});$('mactions').addEventListener('click',function(e){var b=e.target.closest('button[data-modal]');if(!b)return;var action=b.dataset.modal;modalClose();if(action==='fire')fire(false);if(action==='pass')pass();if(action==='reset')setup()});modal.addEventListener('click',function(e){if(e.target===modal)modalClose()});$('reset').addEventListener('click',function(){modalShow('重新開始遊戲？','目前雙方籌碼、秘密裝填、PASS 連續次數與所有本局紀錄都會清除。',[{label:'繼續遊戲',kind:'secondary',id:'close'},{label:'確認重置',kind:'danger',id:'reset'}])});if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});render()})();
