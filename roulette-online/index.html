<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="24發網路輪盤"><title>24發俄羅斯輪盤｜網路對戰</title>
<style>
:root{color-scheme:dark;--bg:#0c0a12;--panel:#191421;--line:#403348;--gold:#edc875;--muted:#b0a5b7;--red:#ff596a;--blue:#54a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#33213d 0,#15101d 42%,var(--bg) 78%);color:#f8f2e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(24px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:44px;height:44px;border:1px solid #a77a39;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:23px}h1{font-size:21px;margin:0}.sub,.muted{color:var(--muted);font-size:12px;line-height:1.65}.sub{margin-top:5px}.badge{margin-left:auto;border:1px solid #655035;color:var(--gold);border-radius:9px;padding:7px 9px;font-size:10px}.panel{background:linear-gradient(145deg,#1c1724,#15111c);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #0002}.kicker{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:800;margin-bottom:8px}h2{font-size:19px;margin:0 0 9px}input{width:100%;background:#100d17;border:1px solid #514057;color:white;border-radius:11px;padding:14px;font-size:16px;margin:6px 0 10px;outline-color:var(--gold)}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary,.secondary,.danger{width:100%;min-height:48px;border-radius:12px;padding:12px;font-weight:800;border:1px solid transparent}.primary{background:linear-gradient(120deg,#f7dfa0,#d4a34f);color:#24170b}.secondary{background:#292131;color:#f8f2e8;border-color:#494052}.danger{background:#3a1824;border-color:#7b2a3d;color:#ffb7c0}.row{display:flex;gap:9px}.row>*{flex:1}.slotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:15px 0}.slot{aspect-ratio:1;border-radius:50%;border:1px solid #665039;background:#241a2a;color:#d9cbb8;font-size:13px;font-weight:800;padding:0}.slot.sel{background:linear-gradient(145deg,#ffe9a6,#be8a33);color:#21150b}.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px}.team{padding:12px;border-radius:12px;background:#211925;border:1px solid #49394b}.team.red{border-color:#783342;background:#2c1720}.team.blue{border-color:#2d5f91;background:#19283b}.team small{display:block;color:#c3b8c8;margin-top:5px;font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px;border-radius:12px;background:#201824;border:1px solid #49394b}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;color:var(--gold);font-size:24px;margin-top:5px}.turn{padding:12px;border-radius:12px;font-weight:850;margin-bottom:10px}.turn.red{background:#351923;border:1px solid #783342;color:#ff9ca7}.turn.blue{background:#192c42;border:1px solid #2d5f91;color:#91c8ff}.wheelbox{display:grid;place-items:center;padding:15px 0}.wheel{width:min(72vw,290px);aspect-ratio:1;border:1px solid #a77a39;border-radius:50%;position:relative;background:radial-gradient(circle,#261c2e 0 24%,#17111f 25% 55%,#0e0b13 56% 60%,#201727 61% 72%,#0e0a12 73%);box-shadow:0 0 0 6px #d9aa4510}.wheel:before{content:"";position:absolute;inset:9%;border:1px solid #ae874a5c;border-radius:50%}.needle{position:absolute;left:50%;top:8%;height:43%;width:2px;background:linear-gradient(var(--gold),transparent);transform-origin:50% 100%}.hub{position:absolute;inset:38%;display:grid;place-items:center;border:1px solid #87612f;border-radius:50%;background:#251a2d;color:var(--gold);font-size:25px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fire,.pass{min-height:58px;border-radius:12px;font-weight:900}.fire{background:linear-gradient(145deg,#f5d991,#c88d35);color:#261807;border:0}.pass{background:#292131;color:white;border:1px solid #514156}.notice{background:#2b2219;border:1px solid #685132;color:#e4c98e;border-radius:11px;padding:11px;margin:10px 0;font-size:12px;line-height:1.6}.log{font-size:11px;line-height:1.7;color:#d0c4d5;white-space:pre-line}.modal{position:fixed;inset:0;background:#050308dc;display:grid;place-items:center;padding:20px;z-index:5}.modal.hidden{display:none}.dialog{max-width:390px;width:100%;background:#1c1724;border:1px solid #695338;border-radius:18px;padding:20px}.dialog p{font-size:13px;line-height:1.7;color:#d0c5d5}.footer{text-align:center;color:#766b7f;font-size:10px;padding:12px}
</style></head><body><main class="app"><header class="head"><div class="logo">✦</div><div><h1>24發俄羅斯輪盤</h1><div class="sub">V10 網路對戰版 · 雙手機即時房間</div></div><div class="badge">ONLINE</div></header><div id="screen"></div><div class="footer">REALTIME ROOM · V10 ONLINE 1.0</div></main><div class="modal hidden" id="modal"><div class="dialog"><h2 id="mtitle">通知</h2><p id="mbody"></p><button class="primary" id="mok">確認</button></div></div>
<script>
(function(){
const API="https://sqayzwpbdwhqvjilrlab.supabase.co/functions/v1/roulette-online";
const $=id=>document.getElementById(id),screen=$("screen");let room=null,token=localStorage.getItem("rouletteOnlineToken")||"",name=localStorage.getItem("rouletteOnlineName")||"",selected=[],timer=null,busy=false,notice="",lastStatus="";
const sideName=s=>s==="red"?"紅方":"藍方",other=s=>s==="red"?"blue":"red";
function msg(title,body){$("mtitle").textContent=title;$("mbody").textContent=body;$("modal").classList.remove("hidden")}
$("mok").onclick=()=>$("modal").classList.add("hidden");
async function call(action,extra={}){if(busy)return;busy=true;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,code:room?.code,token,name,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"連線失敗");if(d.room){room=d.room;if(d.token){token=d.token;localStorage.setItem("rouletteOnlineToken",token)}localStorage.setItem("rouletteOnlineCode",room.code);if(name)localStorage.setItem("rouletteOnlineName",name);if(action==="create"||action==="join")history.replaceState(null,"","?room="+room.code)}if(d.notice)notice=d.notice;selected=room?.state?.mySlots||selected;render();startPoll()}catch(e){msg("連線提示",e.message)}finally{busy=false}}
function startPoll(){if(timer)clearInterval(timer);timer=setInterval(async()=>{if(!room||busy)return;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"poll",code:room.code,token})});const d=await r.json();if(r.ok&&d.room){room=d.room;if(room.status!==lastStatus){lastStatus=room.status;selected=room.state.mySlots||[]}render()}}catch(e){}},1500)}
function stopPoll(){if(timer)clearInterval(timer)}
function baseTeams(){let st=room?.state||{};return '<div class="teams"><div class="team red"><b>● 紅方</b><small>'+(room?.me?.side==="red"?"你":"對手")+' · '+(room?.me?.side==="red"?(st.redChips??150):"等待同步")+'</small></div><div class="team blue"><b>● 藍方</b><small>'+(room?.me?.side==="blue"?"你":"對手")+' · '+(room?.me?.side==="blue"?(st.blueChips??150):"等待同步")+'</small></div></div>'}
function slots(){let h="";for(let i=0;i<24;i++)h+='<button class="slot '+(selected.includes(i)?'sel':'')+'" data-slot="'+i+'">'+(i+1)+'</button>';return h}
function render(){
 if(!room){screen.innerHTML='<section class="panel"><div class="kicker">PLAY WITH A FRIEND</div><h2>建立線上對局</h2><p class="muted">兩位玩家使用不同手機，建立房間後分享房號。紅藍各秘密選 3 格，彼此不會看到對方選位。</p><label>你的暱稱</label><input id="name" maxlength="20" placeholder="輸入暱稱" value="'+name.replace(/"/g,"&quot;")+'"><button class="primary" data-action="create">建立房間</button><div style="height:12px"></div><div class="kicker">JOIN ROOM</div><input id="code" maxlength="6" placeholder="輸入六位房號" style="text-transform:uppercase"><button class="secondary" data-action="join">加入朋友房間</button></section><section class="panel"><h2>玩法保留</h2><p class="muted">紅藍各 150 籌碼、24 格、每方秘密裝填 3 發、重疊則全部重選。一般中槍須確認支付 50；PASS 費用 1／2／4／8／16，第五次由系統代打且不造成中槍。</p></section>';return}
 const st=room.state||{},side=room.me.side,op=room.opponent;
 let top='<section class="panel"><div class="kicker">ROOM CODE</div><h2 style="font-size:28px;letter-spacing:5px">'+room.code+'</h2><p class="muted">分享這組房號給朋友，讓對方在另一台手機加入。房間狀態會自動同步。</p><div class="row"><button class="secondary" data-action="copy">複製房號</button><button class="secondary" data-action="share">分享連結</button></div><div style="height:12px"></div>'+baseTeams()+'</section>';
 if(room.status==="lobby"){screen.innerHTML=top+'<section class="panel"><div class="kicker">WAITING ROOM</div><h2>'+(op?"兩位玩家已就緒":"等待朋友加入…")+'</h2><p class="muted">你是'+sideName(side)+'。'+(op?"可以開始秘密裝填。":"請把房號或連結傳給對手。")+'</p>'+(side==="red"&&op?'<button class="primary" data-action="start">開始對局</button>':'')+'</section>';return}
 if(room.status==="load_red"||room.status==="load_blue"){const mine=(room.status==="load_red"&&side==="red")||(room.status==="load_blue"&&side==="blue");if(!mine){screen.innerHTML=top+'<section class="panel"><h2>等待對手秘密裝填</h2><p class="muted">系統不會顯示對方選位，完成後將自動同步。</p></section>';return}selected=st.mySlots||selected;screen.innerHTML=top+'<section class="panel"><div class="kicker">SECRET LOADING</div><h2>'+sideName(side)+'秘密裝填</h2><p class="muted">請選擇 3 個不同位置。對手不會看到你的選擇。</p><div class="slotgrid">'+slots()+'</div><div class="notice">已選 '+selected.length+' / 3</div><button class="primary" data-action="select" '+(selected.length!==3?'disabled':'')+'>確認秘密裝填</button></section>';return}
 if(room.status==="handoff_blue"){screen.innerHTML=top+'<section class="panel"><h2>請交接給藍方</h2><p class="muted">紅方已完成秘密裝填。藍方請在自己的裝置登入同一房間後繼續。</p>'+(side==="blue"?'<button class="primary" data-action="handoff">開始藍方秘密裝填</button>':'<div class="notice">等待藍方開始裝填…</div>')+'</section>';return}
 if(["playing","payment_pending","finished"].includes(room.status)){
 const bullets=st.bullets||[],remain=bullets.filter(b=>!b.used).length,turn=st.activePlayer;
 const canAct=room.status==="playing"&&turn===side;
 let html=top+'<section class="panel"><div class="kicker">PHYSICS LOCKED</div><h2>中央輪盤</h2><p class="muted">開局重心模擬已完成；對戰不顯示格位編號或裝填歸屬。</p><div class="wheelbox"><div class="wheel"><div class="needle" style="transform:translateX(-50%) rotate('+(st.currentSlot*15)+'deg)"></div><div class="hub">✦</div></div></div><div class="stats"><div class="stat"><small>紅方籌碼</small><b>'+st.redChips+'</b></div><div class="stat"><small>藍方籌碼</small><b>'+st.blueChips+'</b></div><div class="stat"><small>剩餘子彈</small><b>'+remain+' / 6</b></div><div class="stat"><small>目前回合</small><b>'+Math.min(st.round,24)+' / 24</b></div></div></section>';
 if(room.status==="finished"){let win=st.redChips===st.blueChips?"平手":st.redChips>st.blueChips?"紅方獲勝":"藍方獲勝";screen.innerHTML=html+'<section class="panel"><h2>對局結束 · '+win+'</h2><p class="muted">以最終籌碼決定勝負。</p><button class="primary" data-action="home">返回房間入口</button></section>';return}
 if(room.status==="payment_pending"){html+='<section class="panel"><div class="notice">玩家中槍，等待付款確認。請由中槍玩家在自己的裝置確認。</div>'+(st.pendingHit===side?'<button class="primary" data-action="confirm_hit">確認：支付 50 枚籌碼</button>':'<p class="muted">等待對方確認付款；確認前籌碼不會變動。</p>')+'</section>'}
 else html+='<section class="panel"><div class="turn '+turn+'">● 現在輪到'+sideName(turn)+'</div>'+(notice?'<div class="notice">'+notice+'</div>':'')+(canAct?'<div class="actions"><button class="fire" data-action="fire">✦ 開火</button><button class="pass" data-action="pass">↷ PASS<br>本次 '+[1,2,4,8,16][Math.min(st.consecutivePassCount,4)]+' 枚</button></div>':'<p class="muted">等待對手操作…狀態會自動同步。</p>')+'</section>';
 html+='<section class="panel"><div class="kicker">EVENT LOG</div><div class="log">'+(st.log||[]).slice().reverse().map(x=>String(x)).join("\n")+'</div></section>';screen.innerHTML=html;return
 }
 screen.innerHTML=top+'<section class="panel"><h2>同步中…</h2><p class="muted">正在等待伺服器更新。</p></section>'
}
screen.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.slot!==undefined){const n=+b.dataset.slot;if(selected.includes(n))selected=selected.filter(x=>x!==n);else if(selected.length<3)selected.push(n);selected.sort((a,b)=>a-b);render();return}const a=b.dataset.action;if(a==="create"||a==="join"){name=(document.getElementById("name")?.value||"玩家").trim()||"玩家";if(a==="join"){const c=(document.getElementById("code")?.value||new URLSearchParams(location.search).get("room")||"").toUpperCase().trim();if(c.length!==6){msg("需要房號","請輸入朋友分享的六位房號。");return}await call("join",{code:c})}else await call("create");return}if(a==="copy"){try{await navigator.clipboard.writeText(room.code);msg("已複製房號",room.code)}catch{msg("房號",room.code)}return}if(a==="share"){const url=location.origin+location.pathname+"?room="+room.code;if(navigator.share){navigator.share({title:"24發俄羅斯輪盤",text:"加入我的網路對戰，房號 "+room.code,url}).catch(()=>{})}else msg("分享連結",url);return}if(a==="home"){stopPoll();room=null;token="";history.replaceState(null,"",location.pathname);render();return}if(a==="select"){await call("select",{slots:selected});selected=[];return}if(a==="handoff"||a==="start"||a==="fire"||a==="pass"||a==="confirm_hit")await call(a)});
const urlCode=new URLSearchParams(location.search).get("room");render();if(token&&(urlCode||localStorage.getItem("rouletteOnlineCode"))){call("join",{code:(urlCode||localStorage.getItem("rouletteOnlineCode")).toUpperCase()})}else if(urlCode){const ci=document.getElementById("code");if(ci)ci.value=urlCode}
})();
</script></body></html>
