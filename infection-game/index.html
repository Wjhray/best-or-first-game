<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="感染遊戲"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>感染遊戲</title><style>
*{box-sizing:border-box}html{min-height:100%;background:#0b1420}body{margin:0;min-height:100vh;min-height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:#0b1420;color:#edf4fc;font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom))}.panel{background:#142235;border:1px solid #2b4056;border-radius:18px;padding:18px;margin:14px 0}.hero h1{font-size:42px;line-height:1.1;margin:12px 0}.mint{color:#5ce0c0}.muted{color:#9eafc2;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}input{display:block;position:relative;z-index:2;width:100%;min-height:52px;padding:13px;border-radius:10px;border:1px solid #38516b;background:#0b1727;color:white;font-family:system-ui,sans-serif;font-size:16px;font-weight:400;line-height:1.4;margin:6px 0 12px;pointer-events:auto;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;opacity:1}input:focus{outline:2px solid #5ce0c0;outline-offset:2px}button{padding:12px 14px;border:0;border-radius:10px;background:#5ce0c0;color:#08231f;font-weight:750;font:inherit;cursor:pointer}button.secondary{background:#233c56;color:white}button:disabled{opacity:.4}.block{width:100%}.row,.person{display:flex;justify-content:space-between;gap:12px;align-items:center}.person{padding:10px;background:#0e1b2b;border-radius:10px;margin:7px 0}.small{font-size:12px;color:#9eafc2}.timer{font-size:42px;font-weight:850;margin:14px 0}.count{font-size:36px;color:#5ce0c0;font-weight:800}.status{padding:14px;background:#0e1b2b;border:1px solid #38516b;border-radius:12px;margin:10px 0}.infected{border-color:#e66b78;background:#321c2b}.error{color:#ffbdc4}.success{color:#5ce0c0}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
</style></head><body><main class="wrap"><header class="row"><strong>✦ 感染遊戲 <span class="small">V0.6 Alpha</span></strong><span id="conn" class="small">連線中</span></header><div id="app"><section class="panel">載入中…</section></div><p class="small">6–12 位玩家 · 每人一支手機 · 隱藏身份</p><script>
(function(){var API='https://sqayzwpbdwhqvjilrlab.supabase.co/functions/v1/infection-game',key='infection-game-v06-session',sess=null,state=null,app=document.getElementById('app'),conn=document.getElementById('conn'),roomUrl=new URLSearchParams(location.search).get('room')||'';try{sess=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(v){sess=v;if(v)localStorage.setItem(key,JSON.stringify(v));else localStorage.removeItem(key)}
function msg(t,err){var el=document.getElementById('msg');if(!el){el=document.createElement('p');el.id='msg';app.prepend(el)}el.className=err?'error':'success';el.textContent=t}
async function api(action,data){try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action,code:sess&&sess.code,token:sess&&sess.token},data||{}))}),m=await r.json();if(!r.ok||m.type==='error')throw Error(m.message||'操作失敗');if(m.type==='session'){save({code:m.code,playerId:m.playerId,token:m.token});await poll()}else if(m.type==='state'){state=m.state;render()}else if(m.type==='left'){save(null);state=null;landing()} }catch(e){msg(e.message,true)}}
async function poll(){if(!sess)return;try{var r=await fetch(API+'?state=1&code='+encodeURIComponent(sess.code)+'&token='+encodeURIComponent(sess.token),{cache:'no-store'}),m=await r.json();if(!r.ok)throw Error(m.message);state=m.state;conn.textContent='已連線';render()}catch(e){conn.textContent='離線';if(/房間已不存在|找不到先前/.test(e.message)){save(null);state=null;landing(e.message)}}}
function landing(err){state=null;app.innerHTML='<section class="hero"><p class="mint">ONE ROOM · MANY SECRETS</p><h1>信任，是最難的<br><span class="mint">生存遊戲。</span></h1><p class="muted">6–12 位玩家使用不同手機加入同一房間。三個接觸階段，隱藏身份，疫苗決定勝負。</p></section>'+(err?'<p class="error">'+esc(err)+'</p>':'')+'<div class="grid"><form class="panel" id="create"><h2>建立新房間</h2><label class="small">你的遊戲暱稱</label><input name="name" type="text" inputmode="text" autocomplete="nickname" autocapitalize="sentences" enterkeyhint="done" maxlength="16" required placeholder="例如：夜行者"><button class="block">建立房間</button></form><form class="panel" id="join"><h2>加入朋友房間</h2><label class="small">房間代碼</label><input name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="5" required value="'+esc(roomUrl)+'" placeholder="5 位英數代碼"><label class="small">你的遊戲暱稱</label><input name="name" type="text" inputmode="text" autocomplete="nickname" autocapitalize="sentences" enterkeyhint="done" maxlength="16" required placeholder="輸入暱稱"><button class="secondary block">加入房間</button></form></div><section class="panel"><h2>遊戲規則</h2><p class="muted">正常者互相接觸各得一支疫苗；正常者遇感染者時，無疫苗會被感染，有疫苗則消耗一支並交換感染狀態。感染者可消耗一支疫苗自癒。每人全場只成功接觸一次。每階段 3 分鐘，階段間休息 1 分鐘並公布感染總人數。</p></section>';
document.getElementById('create').onsubmit=function(e){e.preventDefault();api('create',{name:new FormData(e.target).get('name')})};document.getElementById('join').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);api('join',{code:String(f.get('code')).toUpperCase(),name:f.get('name')})}}
function button(text,act,attrs,cls){return '<button class="'+(cls||'')+'" data-act="'+act+'" '+(attrs||'')+'>'+text+'</button>'}
function fmt(n){n=Math.max(0,Number(n)||0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function render(){if(!state){landing();return}var s=state,p=s.players||[],h='<section class="hero"><p class="mint">ROOM '+esc(s.code)+'</p><h1>'+(s.status==='lobby'?'等待隊伍<br><span class="mint">集結。</span>':s.status==='ended'?'遊戲<br><span class="mint">結束。</span>':'感染進行中。')+'</h1><p class="muted">房間代碼：<b>'+esc(s.code)+'</b>　'+button('複製邀請連結','copy','','secondary')+'</p></section><section class="panel"><div class="row"><h2>'+(s.status==='lobby'?'等待玩家':s.status==='ended'?'最終結算':s.mode==='break'?'階段休息中':'第 '+s.phase+' / 3 階段')+'</h2><span class="small">'+p.length+' / 12 人</span></div><div class="timer">'+(s.status==='lobby'?'— —':s.status==='ended'?'DONE':fmt(s.remainingSeconds))+'</div>'+(s.infectionCount!=null?'<div class="count">'+s.infectionCount+' 人感染</div>':'')+'</section>';
if(s.status==='lobby'){h+='<section class="panel"><h2>玩家名單</h2>'+p.map(function(x){return '<div class="person"><b>'+esc(x.name)+(x.isSelf?'（你）':'')+(x.id===s.hostId?' · 房主':'')+'<span class="small" style="display:block">'+(x.connected?'在線':'離線')+'</span></b>'+(s.isHost&&!x.isSelf?button('踢出','kick','data-id="'+x.id+'"','secondary'):'')+'</div>'}).join('')+(s.isHost?button('開始遊戲','start',s.canStart?'':'disabled','block')+button('取消房間','cancelRoom','','secondary block'):'<p class="muted">等待房主開始；至少 6 人才能開始。</p>'+button('離開房間','leave','','secondary block'))+'</section>'}
if(s.status==='playing'){h+='<section class="panel"><h2>我的狀態</h2><div class="status '+(s.role==='infected'?'infected':'')+'"><b>'+(s.inInspectionRoom?(s.role==='infected'?'✦ 感染者':'＋ 正常者'):'狀態隱藏')+'</b><p class="small">'+(s.inInspectionRoom?'只有你能看到此狀態。離開後會隱藏。':'進入空閒檢查室查看自己的狀態。')+'</p></div><div class="row"><div><div class="count">'+s.vaccine+'</div><span class="small">我的疫苗</span></div><b>'+(s.contactUsed?'已完成接觸':'尚未接觸')+'</b></div>'+(s.vaccine>0?button('消耗 1 支疫苗自我治療','cure','','block'):'')+'</section><section class="panel"><h2>檢查室</h2><div class="rooms">'+s.inspectionRooms.map(function(r){return '<div class="status"><b>檢查室 '+r.number+'</b><p class="small">'+(r.yours?'你在室內':r.occupied?'使用中':'空閒')+'</p>'+(r.yours?button('離開','leaveInspection'):button('進入','enter','data-room="'+r.number+'" '+(r.occupied?'disabled':''),'secondary'))+'</div>'}).join('')+'</div></section>';
var inv=s.invitations||[];if(inv.length){h+='<section class="panel"><h2>接觸邀請</h2>'+inv.map(function(i){return i.kind==='incoming'?'<div class="person"><span>'+esc(i.fromName)+' 邀請你</span>'+button('接受','respond','data-id="'+i.id+'" data-accept="true"')+' '+button('拒絕','respond','data-id="'+i.id+'" data-accept="false"','secondary')+'</div>':'<p>等待 '+esc(i.toName)+' 回覆。</p>'}).join('')+'</section>'}
if(s.mode==='phase'&&!p.some(function(x){return x.isSelf&&x.contactUsed})){h+='<section class="panel"><h2>邀請接觸</h2>'+p.filter(function(x){return !x.isSelf}).map(function(x){return '<div class="person"><span>'+esc(x.name)+'<br><span class="small">'+(x.contactUsed?'已接觸':x.connected?'在線':'離線')+'</span></span>'+button('邀請','invite','data-id="'+x.id+'" '+(!x.canInvite?'disabled':''),'secondary')+'</div>'}).join('')+'</section>'}}
if(s.status==='playing')h+='<section class="panel"><h2>玩家列表</h2>'+p.map(function(x){return '<div class="person">'+esc(x.name)+(x.isSelf?'（你）':'')+'<span class="small">'+(x.contactUsed?'已接觸':'未接觸')+'</span></div>'}).join('')+'</section>';
if(s.status==='ended'){h+='<section class="panel"><h2>最終排名</h2>'+(s.scoreboard||[]).map(function(x,i){return '<div class="person"><b>'+(i+1)+'. '+esc(x.name)+(x.winner?' · 獲勝':'')+'</b><span>'+x.score+' 支</span></div>'}).join('')+button('建立新房間','new','','block')+'</section>'}
app.innerHTML=h}
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act;if(a==='copy'){var u=new URL(location.href);u.search='?room='+state.code;navigator.clipboard.writeText(u.toString()).then(function(){msg('邀請連結已複製。')}).catch(function(){msg('房間代碼：'+state.code)});return}if(a==='new'){api('leave');save(null);state=null;landing();return}if(a==='respond')api('respondInvite',{invitationId:b.dataset.id,accept:b.dataset.accept==='true'});else if(a==='enter')api('enterInspection',{roomNumber:Number(b.dataset.room)});else if(a==='invite')api('invite',{targetId:b.dataset.id});else if(a==='kick')api('kick',{targetId:b.dataset.id});else api(a)});
setInterval(function(){if(sess)poll();else conn.textContent='可建立房間'},1600);if(sess)poll();else landing();if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();</script></main></body></html>
