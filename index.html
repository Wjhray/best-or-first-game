<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4e6"><link rel="manifest" href="./manifest.webmanifest"><title>《最棒的》還是《第一名》</title>
<style>
:root{--ink:#403642;--paper:#fff9ef;--pink:#ffd9e2;--yellow:#ffe79b;--blue:#d8ecff;--green:#dff4d4;--purple:#e9ddff;--line:#594e5a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:740px;margin:auto;padding:15px}.hero,.panel{border:2.5px solid var(--line);border-radius:23px;padding:16px;margin-bottom:15px;box-shadow:3px 4px 0 var(--line);background:white}.hero{text-align:center;background:var(--yellow);position:relative}.hero h1{font-size:clamp(25px,6vw,38px);margin:8px 0}.hero p{margin:0}.panel h2{font-size:20px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}button{font:inherit;font-weight:750;padding:11px;border:2px solid var(--line);border-radius:13px;background:var(--pink);color:var(--ink);box-shadow:0 3px 0 var(--line)}button:disabled{opacity:.4}.green{background:var(--green)}.blue{background:var(--blue)}.purple{background:var(--purple)}.hidden{display:none!important}.tiny{font-size:13px;opacity:.8}.player{display:flex;align-items:center;gap:8px;padding:8px;margin-top:7px;background:#fff9ef;border:1px dashed #b8aaba;border-radius:12px}.player span{flex:1;overflow-wrap:anywhere}.player button{padding:5px;font-size:12px;background:white;box-shadow:none}.stats{display:flex;gap:7px;margin-top:12px}.stat{flex:1;text-align:center;background:var(--blue);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}.stat strong{display:block;font-size:22px}.notice{margin-top:12px;padding:11px;background:#fff2c9;border:1px dashed var(--line);border-radius:12px}.twocol{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.area{padding:11px;border:2px dashed var(--line);border-radius:15px;background:#fffaf0;min-width:0}.area h3{margin:0 0 8px}.pill{background:var(--purple);padding:4px 9px;border-radius:99px;font-size:13px;font-weight:bold}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.timer{font-size:27px;font-variant-numeric:tabular-nums}.turn{text-align:center;border:2px solid var(--line);border-radius:15px;background:var(--purple);padding:14px;margin:12px 0}.turn strong{display:block;font-size:23px}.choice{font-size:29px}.choice small{display:block;font-size:13px}.score{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #c7b8c7}@media(min-width:560px){.twocol{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<header class="hero"><div style="font-size:26px">🎲 ✦ 🐣 ♡</div><h1>《最棒的》還是《第一名》</h1><p>猜心 × 分組 × 一點點小心機！</p></header>
<section class="panel" id="setup"><h2>🌱 開一桌遊戲</h2><div class="row"><input id="name" maxlength="16" placeholder="輸入玩家名字"><button id="add">加入 ＋</button></div><p class="tiny">至少 3 人，每位玩家輪流擔任莊家一次。</p><div id="players"></div><div class="row" style="margin-top:12px"><button class="green" id="start" disabled>🎉 開始遊戲</button><button class="blue" id="demo">加入 3 位測試玩家</button></div></section>
<section class="panel hidden" id="game"><div class="head"><div><span class="pill" id="round">第 1 回合</span><h2 id="dealerTitle" style="margin-top:8px">莊家回合</h2></div><div style="text-align:right"><span class="tiny">倒數計時</span><div class="timer" id="timer">03:00</div></div></div>
<div class="stats"><div class="stat"><span class="tiny">玩家人數</span><strong id="n">3</strong></div><div class="stat"><span class="tiny">目前莊家</span><strong id="dealer">—</strong></div><div class="stat"><span class="tiny">總回合</span><strong id="total">3</strong></div></div>
<div class="notice" id="prompt">莊家請分配玩家。</div>
<div id="allocation"><div class="twocol"><div class="area"><h3>🧁 A 區</h3><div id="A"></div></div><div class="area"><h3>🍮 B 區</h3><div id="B"></div></div></div><button class="green" id="toChoice" style="width:100%;margin-top:12px">分配完成 → 秘密選擇</button></div>
<div id="selection" class="hidden"><div class="notice">請依序把手機交給每位玩家。上一位的選擇不會顯示，全部完成才公開統計。</div><div class="turn"><span class="tiny">現在輪到</span><strong id="current">玩家</strong><div class="tiny" id="progress"></div></div><div class="row"><button class="choice" data-pick="finger">☝️<small>食指</small></button><button class="choice" data-pick="thumb">👍<small>大拇指</small></button></div></div>
<div id="results" class="hidden"><h2>🎊 本回合結果</h2><div class="twocol"><div class="area"><h3>🧁 A 區結果</h3><div id="resultA"></div></div><div class="area"><h3>🍮 B 區結果</h3><div id="resultB"></div></div></div><h3 style="margin-top:15px">📒 回合後總分</h3><div id="roundScores"></div><button class="green" id="next" style="width:100%;margin-top:12px">下一回合 →</button></div>
<div class="panel" style="margin-top:15px;background:#fff9ef"><h2>🏆 公開總分</h2><div id="board"></div></div><div class="row"><button class="blue" id="resetRound">↻ 重設本回合</button><button class="purple" id="resetGame">重新開始整場</button></div></section>
<p class="tiny" style="text-align:center">可愛塗鴉風原型｜目前是單一裝置輪流操作，尚未支援跨裝置即時連線。</p></main>
<script>
const $=id=>document.getElementById(id);let players=[],scores={},roundNo=0,groups={},picks={},idx=0,seconds=180,clock=null,done=false;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addPlayer(v){v=v.trim();if(v&&players.length<80&&!players.includes(v)){players.push(v);renderPlayers()}$('name').value=''}
function renderPlayers(){$('players').innerHTML='';players.forEach((p,i)=>{const d=document.createElement('div');d.className='player';const s=document.createElement('span');s.textContent='🐣 '+p;const b=document.createElement('button');b.textContent='移除';b.onclick=()=>{players.splice(i,1);renderPlayers()};d.append(s,b);$('players').append(d)});$('start').disabled=players.length<3}
$('add').onclick=()=>$('name').value&&addPlayer($('name').value);$('name').onkeydown=e=>{if(e.key==='Enter')addPlayer($('name').value)};$('demo').onclick=()=>['小花','阿勇','豆豆'].forEach(addPlayer);
$('start').onclick=()=>{scores=Object.fromEntries(players.map(p=>[p,0]));roundNo=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');beginRound()};
function startClock(){clearInterval(clock);showTime();clock=setInterval(()=>{if(seconds>0){seconds--;showTime()}else{clearInterval(clock);$('prompt').textContent='⏰ 時間到，請完成目前階段。'}},1000)}
function showTime(){$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function beginRound(){clearInterval(clock);done=false;groups=Object.fromEntries(players.map(p=>[p,'A']));picks={};idx=0;seconds=180;$('round').textContent='第 '+(roundNo+1)+' 回合 / '+players.length;$('dealer').textContent=players[roundNo];$('dealerTitle').textContent='👑 '+players[roundNo]+' 擔任莊家';$('n').textContent=players.length;$('total').textContent=players.length;$('prompt').textContent='莊家有 3 分鐘分配所有玩家到 A 區或 B 區，莊家本人也必須分配。';$('allocation').classList.remove('hidden');$('selection').classList.add('hidden');$('results').classList.add('hidden');renderGroups();renderBoard();startClock()}
function renderGroups(){['A','B'].forEach(a=>{$(a).innerHTML='';players.filter(p=>groups[p]===a).forEach(p=>{const d=document.createElement('div');d.className='player';const s=document.createElement('span');s.textContent=(p===players[roundNo]?'👑 ':'🐣 ')+p;const b=document.createElement('button');b.textContent='移至 '+(a==='A'?'B':'A');b.onclick=()=>{groups[p]=a==='A'?'B':'A';renderGroups()};d.append(s,b);$(a).append(d)})})}
$('toChoice').onclick=()=>{clearInterval(clock);seconds=players.length<=5?180:300;idx=0;picks={};$('allocation').classList.add('hidden');$('selection').classList.remove('hidden');$('prompt').textContent='秘密選擇階段：選擇不會在統計前公開。';nextPlayer();startClock()};
function nextPlayer(){if(idx>=players.length){scoreRound();return}$('current').textContent=players[idx];$('progress').textContent='已完成 '+idx+' / '+players.length+' 位玩家';document.querySelectorAll('[data-pick]').forEach(b=>b.disabled=false)}
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(done||idx>=players.length)return;picks[players[idx]]=b.dataset.pick;idx++;if(idx<players.length)nextPlayer();else scoreRound()});
function scoreRound(){if(done)return;done=true;clearInterval(clock);$('selection').classList.add('hidden');$('results').classList.remove('hidden');['A','B'].forEach(a=>{const g=players.filter(p=>groups[p]===a),f=g.filter(p=>picks[p]==='finger').length,t=g.length-f;let winners=[];if(g.length>=3&&f!==t){winners=g.filter(p=>f<t?picks[p]==='finger':picks[p]==='thumb');winners.forEach(p=>scores[p]++)}$('result'+a).innerHTML='<p>區內人數：<b>'+g.length+'</b></p><p>☝️ 食指：'+f+' 人</p><p>👍 大拇指：'+t+' 人</p><p>'+(g.length<3?'不足 3 人，不計分。':f===t?'平手，不計分。':'少數選擇者每人 +1 分！')+'</p><p>得分者：'+(winners.length?winners.map(esc).join('、'):'無')+'</p>'});$('roundScores').innerHTML=players.map(p=>'<div class="score"><span>'+esc(p)+'</span><b>'+scores[p]+' 分</b></div>').join('');$('next').textContent=roundNo+1>=players.length?'🏁 最終排名':'下一回合 →';renderBoard()}
function renderBoard(){if(!players.length)return;$('board').innerHTML=players.slice().sort((a,b)=>scores[b]-scores[a]).map((p,i)=>'<div class="score"><span>'+(['🥇','🥈','🥉'][i]||'🐣')+' '+esc(p)+'</span><b>'+(scores[p]||0)+' 分</b></div>').join('')}
$('next').onclick=()=>{if(roundNo+1<players.length){roundNo++;beginRound();return}const rank=players.slice().sort((a,b)=>scores[b]-scores[a]);$('resultA').innerHTML='<h3>🏆 最終排名</h3>'+rank.map((p,i)=>'<p>'+(i+1)+'. '+esc(p)+' — '+scores[p]+' 分</p>').join('');$('resultB').innerHTML='<p>遊戲結束！每位玩家都擔任過一次莊家。</p>';$('next').textContent='重新開始';$('next').onclick=()=>location.reload()};
$('resetRound').onclick=()=>{if(!$('game').classList.contains('hidden'))beginRound()};$('resetGame').onclick=()=>{if(confirm('確定清除進度並重新開始嗎？'))location.reload()};
</script><script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
